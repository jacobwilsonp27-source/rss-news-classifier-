<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search · Pulsewire</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body data-page="search">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><i class="bi bi-broadcast"></i></div>
      <div>
        <div class="sidebar-logo-text">Pulsewire</div>
        <div class="sidebar-logo-sub">AI News Platform</div>
      </div>
    </div>
    <nav class="sidebar-section">
      <a class="nav-link" data-page-link="home" href="index.html">
        <i class="bi bi-house-fill"></i><span>Home</span>
      </a>
      <a class="nav-link" data-page-link="search" href="search.html">
        <i class="bi bi-search"></i><span>Search</span>
      </a>
      <div class="sidebar-section-label" style="margin-top:16px;">Categories</div>
      <div id="categoryLinks"></div>
    </nav>
  </aside>

  <div id="overlay"></div>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <div id="main">
    <header class="top-bar">
      <button id="hamburger"><i class="bi bi-list"></i></button>
      <span class="top-bar-title">Search</span>
    </header>

    <div class="page-content">
      <div class="search-header">
        <h1>Search all news</h1>
        <div class="search-input-wrap">
          <i class="bi bi-search"></i>
          <input
            id="searchInput"
            type="search"
            placeholder="Try &quot;brazil vs morocco&quot; or &quot;climate bill&quot;…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <p class="result-count" id="resultCount"></p>
      </div>

      <!-- Results grid — filled by app.js -->
      <div class="news-grid" id="searchResults">
        <div class="state-box">
          <i class="bi bi-search state-icon"></i>
          <h3>Search all categories</h3>
          <p>Type a topic, team name, keyword, or person — we'll search across all 11 modules at once.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
